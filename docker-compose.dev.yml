# Environnement de DÉVELOPPEMENT — instance isolée d'openclaw-dash.
# Convention : dev.<app>.lan (port 80 via gen-gab-lan.py) → port dev interne.
#
#   URL      : http://dev.dashboard.lan/  →  127.0.0.1:3028
#   Démarrer : sg docker -c "docker compose -f docker-compose.dev.yml up -d --build"
#   Arrêter  : sg docker -c "docker compose -f docker-compose.dev.yml down"
#
# Miroir du prod (même image, mêmes mounts) sur un port dev distinct :
# ./index.js + ./lib sont montés en ro → on teste le CODE LIVE du repo
# avant le switch de prod. network_mode: host → le conteneur écoute
# directement sur l'hôte (port 3028 doit être libre, vérif ss -tlnp).
services:
  openclaw-dash-dev:
    build: .
    image: openclaw-dash:dev
    container_name: openclaw-dash-dev
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      - PORT=3028
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - /:/host:ro
      # Etat du watchdog : ECRIT par le dashboard (bouton "+30 min"). rw specifique.
      - /home/lydstyl/.hermes/cron/output/pc-idle-watchdog:/host/home/lydstyl/.hermes/cron/output/pc-idle-watchdog
      # Etat des agents GTD « Pour IA » : le dashboard ecrit les flags .paused. rw specifique.
      - /home/lydstyl/.hermes/state/pour-ia:/host/home/lydstyl/.hermes/state/pour-ia
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - ~/.ssh/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
      - ~/.ssh/id_ed25519_marie:/root/.ssh/id_ed25519_marie:ro
      - ~/.ssh/id_ed25519_marie.pub:/root/.ssh/id_ed25519_marie.pub:ro
      - ~/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ./index.js:/app/index.js:ro
      - ./lib:/app/lib:ro
      - ./sortable.min.js:/app/sortable.min.js:ro
