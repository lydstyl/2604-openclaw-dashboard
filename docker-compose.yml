version: '3.8'

services:
  openclaw-dash:
    build: .
    container_name: openclaw-dash
    restart: unless-stopped
    pid: "host"
    ports:
      - "127.0.0.1:3015:3015"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - /:/host:ro
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - ~/.ssh/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
      - ~/.ssh/id_ed25519_marie:/root/.ssh/id_ed25519_marie:ro
      - ~/.ssh/id_ed25519_marie.pub:/root/.ssh/id_ed25519_marie.pub:ro
      - ~/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ./index.js:/app/index.js:ro